# Herkunfts-Bot, woechentlich: gleicht Quellen und Lizenzen mit npm, ambientCG und den Links im Netz ab. Veraltete Quellenangaben
# -> PR auf develop, Fehler -> Issue. Bei jedem Push/PR prueft zusaetzlich ci.yml (offline, --check).
# Zeitplan + Knopf laufen erst, wenn diese Datei auf main liegt (wie leyonet-sync.yml).
name: Herkunft
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: herkunft
  cancel-in-progress: false
jobs:
  herkunft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: game
      - name: Pruefen, Quellenangaben erneuern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/herkunft-run.sh
